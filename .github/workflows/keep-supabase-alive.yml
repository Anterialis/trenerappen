# Holder gratisprosjektet på Supabase våkent, og rydder bort gamle økter.
#
# GitHub slår av planlagte jobber etter 60 dager uten aktivitet i repoet, så en vinterpause fra
# koden kunne stoppet dette uten varsel, og da ville Supabase pauset prosjektet. Jobben slår seg
# derfor på igjen selv hver dag, uten commit (en commit ville gitt en Netlify-deploy hver gang).
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 * * *' # every day, 06:00 UTC
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

env:
  SUPABASE_URL: https://nueguoxkynwgmynccaro.supabase.co
  # Den samme offentlige nøkkelen som ligger i app.js. Ingen hemmelighet.
  SUPABASE_KEY: sb_publishable_1Zsq-zFU3nmqYFrSxXzKGQ_k-peb2bV

jobs:
  stay-enabled:
    runs-on: ubuntu-latest
    steps:
      - name: Keep this scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-supabase-alive.yml/enable"

  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Write to keepalive table
        run: |
          curl --fail --silent --show-error -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":1,\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "$SUPABASE_URL/rest/v1/keepalive?on_conflict=id"

  cleanup-old-sessions:
    runs-on: ubuntu-latest
    steps:
      # Funksjonen sletter bare økter uten endring på 60 dager. Før personvernsteg 1 er kjørt finnes
      # den ikke, og da brukes den gamle veien, så jobben virker i begge tilfeller.
      - name: Delete sessions older than 60 days
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "{}" \
            "$SUPABASE_URL/rest/v1/rpc/cleanup_old_sessions")
          echo "cleanup_old_sessions: $status"
          if [ "$status" = "404" ]; then
            CUTOFF=$(date -u -d '60 days ago' +%Y-%m-%dT%H:%M:%SZ)
            curl --fail --silent --show-error -X DELETE \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/sessions?updated_at=lt.$CUTOFF"
          elif [ "$status" -ge 400 ]; then
            exit 1
          fi
